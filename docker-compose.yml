# DriveEase 一体化部署（单容器：API + 前端静态资源 + sql.js 数据文件）
# 首次启动前必读 docs/deployment.md 第 6.2 节：
#   ① 准备数据库文件 data/database.sqlite（否则 Docker 会把挂载点建成目录）
#   ② 在仓库根 .env 设置 JWT_SECRET（compose 自动读取本目录 .env 做 ${} 替换）
services:
  driveease:
    build: .
    image: driveease:latest
    container_name: driveease
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: production
      PORT: 3001
      # JWT 密钥在模块加载时读取，必须是真实环境变量；未设置会报错退出 compose 校验
      JWT_SECRET: ${JWT_SECRET:?请先在仓库根 .env 或 shell 环境变量中设置 JWT_SECRET}
      # COS 四件套（材料上传/OCR；留空则上传接口返回「COS 未配置」，其余功能可用）
      COS_SECRET_ID: ${COS_SECRET_ID:-}
      COS_SECRET_KEY: ${COS_SECRET_KEY:-}
      COS_BUCKET: ${COS_BUCKET:-}
      COS_REGION: ${COS_REGION:-}
    volumes:
      # sql.js 数据文件：宿主机文件 → 容器内固定路径（database.module.ts 按 __dirname 定位）
      - ./data/database.sqlite:/app/server/database.sqlite
    restart: unless-stopped
